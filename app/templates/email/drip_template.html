<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #333333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h1 {
            color: #2667ff;
            margin: 0;
            font-size: 24px;
        }
        .content {
            font-size: 16px;
        }
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eeeeee;
            font-size: 12px;
            color: #888888;
            text-align: center;
        }
    </style>
</head>
<body style="background-color: #f9fbfd;">
    <div class="container">
        <div class="header">
            <h1>Eduecosystem</h1>
        </div>
        <div class="content">
            <p>Hi {{name}},</p>
            <p>{{body}}</p>
            <p>
                Best regards,<br>
                <strong>The Eduecosystem Team</strong>
            </p>
        </div>
        <div class="footer">
            <p>&copy; 2025 Eduecosystem. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
